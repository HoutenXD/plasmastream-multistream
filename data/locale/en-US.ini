PlasmaStream.Multistream="PlasmaStream Multistream"

# Why a destination stopped, in words somebody can act on. OBS hands back an
# integer; "Error -4" tells a streamer nothing at the moment they have the least
# patience for it, so each one names the thing to go and check.
Error.BadPath="The server address is not one this platform accepts. Check it in that platform's own streaming settings."
Error.ConnectFailed="Could not reach the server. This is usually the address being wrong, or the connection dropping."
Error.InvalidStream="The stream key was rejected. Copy it again from the platform, since most of them expire or get reset."
Error.Disconnected="The connection dropped. If this keeps happening, your upload speed is probably not enough for every destination at once."
Error.Unknown="Stopped for a reason the plugin did not recognise. The OBS log will have the detail."
